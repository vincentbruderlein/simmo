      const sub = st === "done" ? starRow(rec.stars) : `<span class="t">${TIERS[l.tier] || ""}${st === "locked" ? " · verrouillé" : ""}</span>`;
      return `<li class="step" style="--w:${w.color};margin-left:${OFFS[i % OFFS.length]}px">
        <button class="node ${st}" data-a="level" data-id="${esc(l.id)}" aria-label="Étape ${i + 1} : ${esc(l.title)}${st === "locked" ? " (verrouillée)" : ""}">${icon}</button>
        <div class="step-text"><b>${esc(l.title)}</b>${sub}</div></li>`;
    }).join("");
    return `<section class="panel lot" style="--w:${w.color}" aria-label="${esc(w.title)}">
      <div class="lot-head">${houseSVG(w.color, stage, { indicator: !!cur })}
        <div><h2><span aria-hidden="true">${esc(w.emoji)}</span> ${esc(w.title)}</h2><p class="desc">${esc(w.desc)}</p>
          <div class="stage-lab"><i></i>${STAGE_LABEL[stage]}</div>
          <div class="segs" role="progressbar" aria-valuemin="0" aria-valuemax="${pr.total}" aria-valuenow="${pr.done}" aria-label="Étapes terminées">${segs}</div></div></div>
      <ol class="path">${steps}</ol></section>`;
  }
  function viewMap() {
    const rev = Progress.notionsToReview();
    const revCard = rev.length
      ? `<button class="review-cta" data-a="review-all"><div><b>${rev.length} notion${rev.length > 1 ? "s" : ""} à revoir</b><span class="small">${esc(rev.slice(0, 3).map((r) => r.label).join(", "))}</span></div><span class="go">Réviser</span></button>`
      : "";
    return storageBanner() + demoBanner() + meCard() + revCard + Content.worlds.map(worldHTML).join("");
  }

  /* Fenêtre de détail d'une étape */
  function sheetHTML() {
    const l = Content.levels[ui.sheet];
    if (!l) return "";
    const w = Content.world(l.worldId), st = Progress.levelState(l), rec = Store.state.levels[l.id];
    const types = [...new Set(l.questions.map((q) => q.type))].map((t) => ({ mcq: "Choix multiples", tf: "Vrai / faux", open: "Réponses ouvertes" }[t]));
    const prev = l.index > 0 ? w.levels[l.index - 1] : null;
    return `<div class="scrim" data-a="close-sheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(l.title)}">
      <div><span class="small muted">${esc(w.title)} · Étape ${l.index + 1}</span><h2>${esc(l.title)}</h2></div>
      <p>${esc(l.desc)}</p>
      <div class="pills"><span class="pill">${TIERS[l.tier] || ""}</span><span class="pill">${l.questions.length} questions</span>${types.map((t) => `<span class="pill">${t}</span>`).join("")}</div>
      ${rec && rec.done ? `<div>${starRow(rec.stars)} <span class="small muted">Meilleur score : ${rec.best} % du premier coup</span></div>` : ""}
      ${st === "locked"
        ? `<p class="note">Termine d’abord « ${esc(prev.title)} » pour débloquer cette étape.</p><button class="btn ghost" data-a="close-sheet-btn">Fermer</button>`
        : `<button class="btn" data-a="start-level" data-id="${esc(l.id)}">${st === "done" ? "Rejouer" : "Commencer"}</button><button class="btn ghost" data-a="close-sheet-btn">Plus tard</button>`}
    </div></div>`;
  }

  /* ───────────── Onglet Mélange ───────────── */
  function viewMix() {
    if (!ui.mix.worlds) ui.mix.worlds = new Set(Content.worlds.map((w) => w.id));
    const sel = [...ui.mix.worlds];
    const pool = Progress.unlockedQuestions(sel);
    const n = Math.min(ui.mix.n, pool.length);
    const chips = Content.worlds.map((w) =>
      `<button class="tog wchip" style="--w:${w.color}" data-a="mix-world" data-id="${esc(w.id)}" aria-pressed="${ui.mix.worlds.has(w.id)}"><span aria-hidden="true">${esc(w.emoji)}</span>${esc(w.title)}</button>`).join("");
    const counts = [8, 12, 16].map((c) => `<button data-a="mix-n" data-n="${c}" aria-pressed="${ui.mix.n === c}">${c}</button>`).join("");
    return `<div class="panel pad stack"><h2 style="margin:0">Tour du quartier</h2>
      <p class="muted">Mélange des questions de plusieurs matières, comme à l’examen. Seules les étapes déjà débloquées sont utilisées.</p>
      <div><span class="field-label">Matières incluses</span><div class="seg">${chips}</div></div>
      <div><span class="field-label">Nombre de questions</span><div class="seg">${counts}</div></div>
      <div><button class="tog" data-a="mix-weak" aria-pressed="${ui.mix.weak}">Commencer par mes points faibles</button></div>
      <p class="note" role="status">${pool.length ? `${pool.length} questions disponibles dans ce mélange · série de ${n}.` : "Aucune question disponible : choisissez au moins une matière."}</p>
      <button class="btn" data-a="mix-start" ${pool.length ? "" : "disabled"}>Lancer la série</button></div>
      ${demoBanner()}`;
  }

  /* ───────────── Onglet Carrière ───────────── */
  function chartHTML() {
    const days = Progress.last7(), goal = Store.state.settings.dailyGoal;
    const W = 320, H = 156, top = 20, bot = 24, bw = 30, gap = (W - 7 * bw) / 8;
    const max = Math.max(goal, ...days.map((d) => d.xp), 10) * 1.1, base = H - bot;
    const y = (v) => top + (base - top) * (1 - v / max);
    const bars = days.map((d, i) => {
      const x = gap + i * (bw + gap), h = Math.max(d.xp ? base - y(d.xp) : 3, 3);
      const cls = d.xp >= goal ? "b hit" : d.today ? "b today" : "b";
      const lab = d.today ? "Auj." : d.date.toLocaleDateString("fr-CH", { weekday: "short" }).replace(".", "");
      return `<rect class="${cls}" x="${x.toFixed(1)}" y="${(base - h).toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="7"/>` +
        (d.xp ? `<text class="val" x="${(x + bw / 2).toFixed(1)}" y="${(base - h - 5).toFixed(1)}" text-anchor="middle">${d.xp}</text>` : "") +
        `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(lab)}</text>`;
    }).join("");
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Briques gagnées ces 7 derniers jours">
      <line class="goal" x1="0" x2="${W}" y1="${y(goal).toFixed(1)}" y2="${y(goal).toFixed(1)}"/>
      <line class="axis" x1="0" x2="${W}" y1="${base}" y2="${base}"/>${bars}</svg>`;
  }
  function viewStats() {
    const s = Store.state, pl = Progress.playerLevel(), acc = Progress.accuracy();
    const hero = `<section class="panel pad"><div class="me">${mascot("cheer")}<div><div class="rank">${esc(pl.title)}</div>
      <div class="muted small" style="margin:2px 0 6px">Niveau ${pl.level} · ${pl.into}/${pl.per} briques pour le grade suivant</div>
      <div class="glossbar"><i style="width:${pct(pl.into / pl.per)}%"></i></div></div></div></section>`;
    const tiles = `<div class="tiles">
      <div class="tile"><div class="v num">${s.xp}</div><div class="l">Briques au total</div></div>
      <div class="tile"><div class="v num">${Progress.streakAlive()} j</div><div class="l">De suite (record ${s.streak.best})</div></div>
      <div class="tile"><div class="v num">${acc === null ? "–" : pct(acc) + " %"}</div><div class="l">Réponses justes (${s.stats.ok}/${s.stats.answers})</div></div>
      <div class="tile"><div class="v num">${Content.worlds.reduce((n, w) => n + Progress.worldProgress(w).done, 0)}/${Object.keys(Content.levels).length}</div><div class="l">Étapes terminées</div></div></div>`;
    const mastery = Content.worlds.map((w) => {
      const m = Progress.worldMastery(w);
      return `<div class="mrow" style="--w:${w.color}"><div class="ico" aria-hidden="true">${esc(w.emoji)}</div><div><b>${esc(w.title)}</b><div class="glossbar"><i style="width:${pct(m.mastered / m.total)}%"></i></div></div><span class="small muted num">${m.mastered}/${m.total}</span></div>`;
    }).join("");
    const rev = Progress.notionsToReview();
    const revHTML = rev.length
      ? `<ul class="review-list">${rev.slice(0, 8).map((r) => {
          const w = Content.world(r.worldId);
          return `<li><div><b>${esc(r.label)}</b><span class="small muted"><span class="badge-dot" style="background:${w.color}"></span>${esc(w.title)} · ${r.acc === null ? "" : pct(r.acc) + " % de réussite · "}${r.weak} à retravailler</span></div><button class="btn sm" data-a="review-notion" data-key="${esc(r.key)}">Réviser</button></li>`;
        }).join("")}</ul>`
      : `<p class="muted">${s.stats.answers ? "Rien à revoir pour l’instant. Les notions où vous vous trompez apparaîtront ici." : "Jouez une première étape : les notions à retravailler apparaîtront ici."}</p>`;
    const badges = Rewards.BADGES.map((b) => {
      const on = !!s.badges[b.id];
      return `<div class="badge ${on ? "" : "off"}"><div class="medal" aria-hidden="true">${b.icon}</div><b>${esc(b.name)}</b><span>${on ? "Obtenu" : esc(b.hint)}</span></div>`;
    }).join("");
    const earned = Object.keys(s.badges).length;
    return hero + tiles +
      `<section class="panel pad"><h2>7 derniers jours</h2>${chartHTML()}<p class="small muted" style="margin-top:6px">Ligne pointillée : objectif de ${s.settings.dailyGoal} briques. Barre verte : objectif atteint.</p></section>` +
      `<section class="panel pad"><h2>À revoir</h2>${revHTML}${rev.length ? `<div style="margin-top:14px"><button class="btn ghost" data-a="review-all">Réviser mes questions ratées</button></div>` : ""}</section>` +
      `<section class="panel pad"><h2>Maîtrise par matière</h2><p class="small muted" style="margin:-4px 0 12px">Questions réussies à la dernière tentative.</p><div class="mastery">${mastery}</div></section>` +
      `<section class="panel pad"><h2>Trophées · ${earned}/${Rewards.BADGES.length}</h2><div class="badges">${badges}</div></section>`;
  }

  /* ───────────── Onglet Réglages ───────────── */
  function fmtDate(ts) { return ts ? new Date(ts).toLocaleString("fr-CH", { dateStyle: "medium", timeStyle: "short" }) : "jamais"; }
  function viewSettings() {
    const s = Store.status, st = Store.state, snd = st.settings.sound;
    const goals = [30, 50, 80, 120].map((v) => `<button data-a="goal" data-v="${v}" aria-pressed="${st.settings.dailyGoal === v}">${v} briques</button>`).join("");
    const vols = [["Doux", 0.35], ["Moyen", 0.7], ["Fort", 1]].map(([l, v]) => `<button data-a="vol" data-v="${v}" aria-pressed="${snd.volume === v}">${l}</button>`).join("");
    const where = s.mode === "memory" ? "Mémoire seulement (stockage bloqué)" : "Dans ce navigateur" + (s.persistent === true ? " (stockage protégé)" : "");
    const packs = (g.LUMO_PACKS || []).map((p) => `<li>${esc(p.title)}${p.demo ? ' <span class="pill">démo · fictif</span>' : ""} <span class="muted small">· ${p.worlds.length} matières</span></li>`).join("");
    return `<section class="panel pad stack"><h2 style="margin:0">Objectif quotidien</h2><div class="seg">${goals}</div></section>
      <section class="panel pad stack"><h2 style="margin:0">Sons</h2>
        <div class="seg"><button data-a="snd" data-v="1" aria-pressed="${snd.on}">${ICON.speaker.replace("<svg", '<svg width="20" height="20" style="stroke:currentColor;fill:none"')} Activés</button><button data-a="snd" data-v="0" aria-pressed="${!snd.on}">${ICON.mute.replace("<svg", '<svg width="20" height="20" style="stroke:currentColor;fill:none"')} Coupés</button></div>
        <div><span class="field-label">Volume</span><div class="seg">${vols}</div></div>
        <button class="btn ghost" data-a="snd-test">Écouter un exemple</button>
        <p class="small muted">Sur iPhone, le commutateur « silencieux » sur le côté coupe aussi les sons du jeu.</p></section>
      <section class="panel pad stack"><h2 style="margin:0">Sauvegarde</h2>
        <p class="note ${s.ok ? "ok" : "err"}" role="status">${s.ok ? "Progression enregistrée automatiquement après chaque réponse." : esc(s.error)}<br><span class="small muted">Emplacement : ${where}. Dernière sauvegarde : ${fmtDate(s.lastSave)}.</span></p>
        <p class="small muted">Le navigateur peut effacer ses données si vous ne l’utilisez plus pendant longtemps. Copiez de temps en temps votre sauvegarde dans une note ou un e-mail.</p>
        <div class="row"><button class="btn" data-a="copy-backup">Copier ma sauvegarde</button><button class="btn ghost" data-a="dl-backup">Télécharger</button></div>
        ${ui.exportText ? `<textarea id="exp" readonly aria-label="Texte de sauvegarde">${esc(ui.exportText)}</textarea>` : ""}
        <label class="field-label" for="imp" style="margin:6px 0 0">Restaurer depuis une sauvegarde</label>
        <textarea id="imp" placeholder="Collez ici le texte copié précédemment" spellcheck="false"></textarea>
        <button class="btn ghost" data-a="import">Restaurer</button>
        ${ui.msg ? `<p class="note ${ui.msg.kind}" role="status">${esc(ui.msg.text)}</p>` : ""}
      </section>
      <section class="panel pad stack"><h2 style="margin:0">Contenus</h2><ul class="opts">${packs}</ul>
        <p class="small muted">L’import de vos propres cours (PDF, Word, notes, examens) est prévu à l’étape suivante.</p></section>
      <section class="panel pad stack"><h2 style="margin:0">Effacer la progression</h2>
        ${ui.resetAsk
          ? `<p class="note err">Cela supprime briques, trophées et étapes. Cette action est définitive.</p><div class="row"><button class="btn bad" data-a="reset-yes">Oui, tout effacer</button><button class="btn ghost" data-a="reset-no">Annuler</button></div>`
          : `<button class="btn ghost" data-a="reset-ask">Effacer…</button>`}</section>`;
  }

  /* ───────────── Rendu principal ───────────── */
  function render() {
    const views = { map: viewMap, mix: viewMix, stats: viewStats, settings: viewSettings };
    $("#view").innerHTML = views[ui.tab]();
    $("#sheet-host").innerHTML = ui.sheet ? sheetHTML() : "";
    renderHeader();
    renderNav();
  }

  /* ───────────── Série de questions ───────────── */
  const PRAISE = ["Bien joué !", "Exact !", "Parfait !", "Bravo !", "Excellent !", "Bonne réponse !"];
  const TYPE_LABEL = { mcq: "Choix multiple", tf: "Vrai ou faux", open: "Réponse ouverte" };

  function startSession(sess) {
    ui.sheet = null;
    const stageBefore = sess.level ? Progress.houseStage(Content.world(sess.level.worldId)) : null;
    ui.s = { session: sess, phase: "q", sel: null, text: "", quitAsk: false, sum: null, stageBefore };
    $("#sheet-host").innerHTML = "";
    renderSess();
  }
  const levelSession = (l) => {
    const w = Content.world(l.worldId);
    return new Session({ mode: "level", title: l.title, subtitle: w.title, level: l, questions: Pick.level(l), again: () => levelSession(l) });
  };
  const mixSession = (o) => new Session({ mode: "mix", title: "Tour du quartier", questions: Pick.mix(o), again: () => mixSession(o) });
  const notionSession = (key) => new Session({ mode: "review", title: "Révision : " + Content.notions[key].label, questions: Pick.notion(key), again: () => notionSession(key) });
  const weakSession = () => new Session({ mode: "review", title: "Questions à revoir", questions: Pick.weak(), again: () => weakSession() });

  function answerAreaHTML(S) {
    const item = S.session.current, q = item.q, fb = S.phase === "fb" ? S.session.pending : null;
    if (q.type === "mcq") {
      const btns = item.order.map((orig, i) => {
        let cls = "choice";
        if (fb) { if (orig === q.answer) cls += " right"; else if (fb.given === orig) cls += " wrong"; }
        else if (S.sel === i) cls += " sel";
        return `<button class="${cls}" data-a="pick" data-i="${i}" ${fb ? "disabled" : ""} aria-pressed="${S.sel === i}"><span class="k">${"ABCDEF"[i]}</span><span>${esc(q.choices[orig])}</span></button>`;
      }).join("");
      return `<div class="choices">${btns}</div>`;
    }
    if (q.type === "tf") {
      const b = (v, label) => {
        let cls = "choice";
        if (fb) { if (v === q.answer) cls += " right"; else if (fb.given === v) cls += " wrong"; }
        else if (S.sel === v) cls += " sel";
        return `<button class="${cls}" data-a="tf" data-v="${v}" ${fb ? "disabled" : ""} aria-pressed="${S.sel === v}">${label}</button>`;
      };
      return `<div class="choices tf">${b(true, "Vrai")}${b(false, "Faux")}</div>`;
    }
    const cls = fb ? (fb.res.ok ? "right" : "wrong") : "";
    return `<div class="choices"><input id="ans" class="answer-input ${cls}" type="text" inputmode="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Votre réponse" value="${esc(fb ? (fb.given == null ? "" : fb.given) : S.text)}" ${fb ? "readonly" : ""} aria-label="Votre réponse"></div>
      ${fb ? "" : `<button class="btn ghost skip sm" data-a="skip" style="width:auto">Je ne sais pas</button>`}`;
  }

  function footHTML(S) {
    const sess = S.session;
    if (S.phase === "q") {
      const q = sess.current.q;
      const ready = q.type === "open" ? S.text.trim() !== "" : S.sel !== null;
      return `<div class="sess-foot"><div><button id="check" class="btn" data-a="check" ${ready ? "" : "disabled"}>Vérifier</button></div></div>`;
    }
    const { item, res, given } = sess.pending, q = item.q;
    if (res.ok) {
      return `<div class="sess-foot good fb" role="status"><div>
        <div class="fb-head">${mascot("cheer")}<div><b>${PRAISE[sess.answers % PRAISE.length]}</b>${res.typo ? `<span class="small">Attention à l’orthographe : ${esc(Engine.Grade.expected(q))}</span>` : ""}</div></div>
        <button id="next" class="btn good" data-a="next">Continuer</button></div></div>`;
    }
    return `<div class="sess-foot bad fb" role="alert"><div>
      <div class="fb-head">${mascot("sad")}<div><b>${given === null ? "Pas de souci" : "Pas tout à fait"}</b><span class="fb-expected">Bonne réponse : ${esc(Engine.Grade.expected(q))}</span></div></div>
      <p class="fb-expl">${esc(q.expl)}</p>
      <p class="fb-requeue">Cette question reviendra à la fin de la série.</p>
      <button id="next" class="btn bad" data-a="next">Continuer</button></div></div>`;
  }

  function endHTML(S) {
    const sess = S.session, m = S.sum, isLevel = sess.mode === "level";
    const title = isLevel ? "Étape terminée !" : sess.mode === "mix" ? "Tour du quartier terminé !" : "Révision terminée !";
    const lines = [];
    if (m.goalJustReached) lines.push("Objectif du jour atteint.");
    if (m.streak > 1) lines.push(`${m.streak} jours de suite.`);
    if (m.recovered) lines.push(`${m.recovered} question${m.recovered > 1 ? "s" : ""} ratée${m.recovered > 1 ? "s" : ""} rattrapée${m.recovered > 1 ? "s" : ""}.`);
    const badges = m.newBadges.length ? `<div class="new-badges">${m.newBadges.map((b) => `<span class="pill">${b.icon} Trophée : ${esc(b.name)}</span>`).join("")}</div>` : "";
    const confetti = Array.from({ length: 36 }, (_, i) => {
      const c = ["#2290DC", "#FFC83D", "#45B530", "#FF8FA3", "#E8504A"][i % 5];
      return `<i style="left:${(i * 53) % 100}%;background:${c};animation-duration:${2.2 + ((i * 7) % 10) / 6}s;animation-delay:${((i * 3) % 10) / 12}s"></i>`;
    }).join("");
    let visual;
    if (isLevel) {
      const w = Content.world(sess.level.worldId), stage = Progress.houseStage(w);
      const grew = stage > S.stageBefore;
      visual = houseSVG(w.color, stage, { anim: grew ? stage : "" }) + (grew ? `<div class="stage-note">${STAGE_LABEL[stage]}</div>` : "");
    } else visual = mascot("cheer");
    return `<div class="end"><div class="confetti" aria-hidden="true">${confetti}</div>
      <div class="end-inner">${visual}<h1>${title}</h1>
        ${isLevel ? starRow(m.stars, "big-stars") : ""}
        <div class="res"><div class="tile"><div class="v num">+${m.xp}</div><div class="l">Briques gagnées</div></div>
          <div class="tile"><div class="v num">${pct(m.acc)} %</div><div class="l">Du premier coup</div></div>
          <div class="tile"><div class="v num">${m.requeued}</div><div class="l">Questions revues</div></div></div>
        ${lines.length ? `<p class="muted" style="font-weight:700">${lines.join(" ")}</p>` : ""}${badges}
      </div>
      <div class="end-foot">
        ${m.nextLevel ? `<button class="btn" data-a="end-next">Étape suivante</button><button class="btn ghost" data-a="end-close">Retour au quartier</button>`
          : `<button class="btn" data-a="end-close">Continuer</button>`}
        <button class="btn ghost" data-a="end-again">Rejouer</button></div></div>`;
  }

  function renderSess() {
    const S = ui.s;
    let host = $("#sess");
    if (!S) { if (host) host.remove(); document.body.style.overflow = ""; return; }
    if (!host) {
      host = document.createElement("div");
      host.id = "sess"; host.className = "sess";
      host.setAttribute("role", "dialog"); host.setAttribute("aria-modal", "true");
      document.body.appendChild(host);
      document.body.style.overflow = "hidden";
    }
    if (S.phase === "end") { host.setAttribute("aria-label", "Résultats"); host.innerHTML = endHTML(S); return; }

    const sess = S.session, item = sess.current, q = item.q;
    host.setAttribute("aria-label", sess.title);
    const ctx = q.context ? `<div class="q-ctx"><b>Situation</b>${esc(q.context)}</div>` : "";
    host.innerHTML = `
      <div class="sess-top"><button class="x" data-a="quit" aria-label="Quitter la série">${ICON.x}</button>
        <div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="${sess.total}" aria-valuenow="${sess.solved}" aria-label="Progression"><i style="width:${pct(sess.solved / sess.total)}%"></i></div></div>
      <div class="sess-body"><div class="sess-inner">
        <div class="kicker"><span>${esc(TYPE_LABEL[q.type])}</span><span aria-hidden="true">·</span><span>${esc(q.notion)}</span>${item.retry ? '<span class="retry">À retenter</span>' : ""}</div>
        <div class="ask">${mascot("happy")}<div class="bubble">${ctx}<h1 class="q-text">${esc(q.q)}</h1></div></div>
        ${answerAreaHTML(S)}
      </div></div>
      ${footHTML(S)}
      ${S.quitAsk ? `<div class="quit"><div class="panel"><h2 style="margin:0">Quitter la série ?</h2><p class="muted">L’étape ne sera pas validée et les briques de cette série seront perdues. Vos réponses restent comptées dans « à revoir ».</p><button class="btn" data-a="quit-no">Continuer à jouer</button><button class="btn ghost" data-a="quit-yes">Quitter</button></div></div>` : ""}`;
    if (S.phase === "q" && q.type === "open" && !S.quitAsk) { const a = $("#ans"); if (a) a.focus({ preventScroll: true }); }
  }

  function checkAnswer() {
    const S = ui.s; if (!S || S.phase !== "q") return;
    const q = S.session.current.q;
    let given;
    if (q.type === "mcq") { if (S.sel === null) return; given = S.session.current.order[S.sel]; }
    else if (q.type === "tf") { if (S.sel === null) return; given = S.sel; }
    else { if (!S.text.trim()) return; given = S.text; }
    const res = S.session.submit(given);
    Sound.play(res.ok ? "correct" : "wrong");
    S.phase = "fb";
    renderSess(); renderHeader();
  }
  function nextQuestion() {
    const S = ui.s; if (!S || S.phase !== "fb") return;
    const done = S.session.advance();
    S.sel = null; S.text = "";
    if (done) { S.sum = S.session.finish(); S.phase = "end"; renderHeader(); endSounds(S); }
    else { S.phase = "q"; Sound.play("tap"); }
    renderSess();
  }
  /* Sons de fin de série : coups de marteau si la maison avance, fanfare, étoiles, trophées */
  function endSounds(S) {
    const m = S.sum;
    let t = 0;
    if (S.session.mode === "level") {
      const stage = Progress.houseStage(Content.world(S.session.level.worldId));
      if (stage > S.stageBefore) { Sound.play("hammer"); t = 0.55; }
    }
    Sound.play("fanfare", t);
    if (S.session.mode === "level") for (let i = 0; i < m.stars; i++) Sound.play("star", t + 0.45 + i * 0.15);
    if (m.newBadges.length) Sound.play("badge", t + 1.3);
  }
  function closeSession() {
    ui.s = null; renderSess(); render();
    window.scrollTo(0, 0);
  }

  /* ───────────── Événements ───────────── */
  function copyText(text) {
    try { return navigator.clipboard.writeText(text); } catch (e) { return Promise.reject(e); }
  }
  const OPEN_ACTIONS = new Set(["level", "start-level", "mix-start", "review-notion", "review-all", "end-next", "end-again"]);
  const SILENT = new Set(["pick", "tf", "check", "next", "snd", "snd-test", "vol"]);

  document.addEventListener("pointerdown", () => Sound.unlock(), { passive: true });

  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-a]");
    if (!el) return;
    const a = el.dataset.a, S = ui.s;
    if (a === "pick" || a === "tf") Sound.play("select");
    else if (OPEN_ACTIONS.has(a)) Sound.play("open");
    else if (a === "quit-yes") Sound.play("quit");
    else if (!SILENT.has(a) && !(a === "close-sheet" && e.target !== el)) Sound.play("tap");
    switch (a) {
      case "level": ui.sheet = el.dataset.id; render(); { const b = $(".sheet .btn"); if (b) b.focus(); } break;
      case "close-sheet": if (e.target === el) { ui.sheet = null; render(); } break;
      case "close-sheet-btn": ui.sheet = null; render(); break;
      case "start-level": startSession(levelSession(Content.levels[el.dataset.id])); break;
      case "mix-world": { const set = ui.mix.worlds, id = el.dataset.id; set.has(id) ? set.delete(id) : set.add(id); render(); break; }
      case "mix-n": ui.mix.n = +el.dataset.n; render(); break;
      case "mix-weak": ui.mix.weak = !ui.mix.weak; render(); break;
      case "mix-start": startSession(mixSession({ worldIds: [...ui.mix.worlds], n: ui.mix.n, weakFirst: ui.mix.weak })); break;
      case "review-notion": startSession(notionSession(el.dataset.key)); break;
      case "review-all": {
        const weak = Pick.weak();
        if (weak.length) startSession(weakSession());
        else { const r = Progress.notionsToReview()[0]; if (r) startSession(notionSession(r.key)); }
        break;
      }
      case "goal": Store.state.settings.dailyGoal = +el.dataset.v; Store.save(); render(); break;
      case "snd": { const on = el.dataset.v === "1"; Store.state.settings.sound.on = on; Store.save(); Sound.configure(Store.state.settings.sound); render(); if (on) Sound.play("correct"); break; }
      case "vol": { Store.state.settings.sound.volume = +el.dataset.v; Store.save(); Sound.configure(Store.state.settings.sound); render(); Sound.play("correct"); break; }
      case "snd-test": { const wasOn = Sound.on; Sound.on = true; Sound.play("tap"); Sound.play("correct", 0.2); Sound.play("hammer", 0.9); Sound.play("fanfare", 1.5); Sound.on = wasOn; break; }
      case "copy-backup": {
        const text = Store.exportText();
        ui.msg = null;
        copyText(text).then(() => { ui.exportText = ""; ui.msg = { kind: "ok", text: "Sauvegarde copiée. Collez-la dans une note ou un e-mail." }; render(); })
          .catch(() => { ui.exportText = text; ui.msg = { kind: "ok", text: "Copie automatique refusée : sélectionnez le texte ci-dessus et copiez-le à la main." }; render(); const t = $("#exp"); if (t) { t.focus(); t.select(); } });
        break;
      }
      case "dl-backup": {
        try {
          const blob = new Blob([Store.exportText()], { type: "application/json" });
          const url = URL.createObjectURL(blob), x = document.createElement("a");
          x.href = url; x.download = "simmo-sauvegarde-" + Store.dayKey() + ".json";
          document.body.appendChild(x); x.click(); x.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
          ui.msg = { kind: "ok", text: "Téléchargement lancé. S’il ne se passe rien, utilisez « Copier ma sauvegarde »." };
        } catch (err) { ui.msg = { kind: "err", text: "Téléchargement impossible ici. Utilisez « Copier ma sauvegarde »." }; }
        render(); break;
      }
      case "import": {
        const r = Store.importText($("#imp").value.trim());
        ui.msg = r.ok ? { kind: "ok", text: "Progression restaurée." } : { kind: "err", text: r.error };
        if (r.ok) { ui.exportText = ""; Sound.configure(Store.state.settings.sound); }
        render(); break;
      }
      case "reset-ask": ui.resetAsk = true; render(); break;
      case "reset-no": ui.resetAsk = false; render(); break;
      case "reset-yes": Store.reset(); Sound.configure(Store.state.settings.sound); ui.resetAsk = false; ui.exportText = ""; ui.msg = { kind: "ok", text: "Progression effacée." }; render(); break;
      /* session */
      case "pick": if (S && S.phase === "q") { S.sel = +el.dataset.i; renderSess(); } break;
      case "tf": if (S && S.phase === "q") { S.sel = el.dataset.v === "true"; renderSess(); } break;
      case "skip": if (S && S.phase === "q") { S.session.submit(null); Sound.play("wrong"); S.phase = "fb"; renderSess(); renderHeader(); } break;
      case "check": checkAnswer(); break;
      case "next": nextQuestion(); break;
      case "quit": if (S) { S.quitAsk = true; renderSess(); } break;
      case "quit-no": if (S) { S.quitAsk = false; renderSess(); } break;
      case "quit-yes": closeSession(); break;
      case "end-close": closeSession(); break;
      case "end-next": { const nx = S.sum.nextLevel; ui.s = null; renderSess(); render(); startSession(levelSession(nx)); break; }
      case "end-again": { const again = S.session.again; ui.s = null; renderSess(); render(); startSession(again()); break; }
    }
  });

  document.querySelector(".nav").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-tab]");
    if (!b) return;
    Sound.play("tap");
    ui.tab = b.dataset.tab; ui.sheet = null; ui.msg = null; ui.resetAsk = false;
    render(); window.scrollTo(0, 0);
  });

  document.addEventListener("input", (e) => {
    if (e.target.id === "ans" && ui.s && ui.s.phase === "q") {
      ui.s.text = e.target.value;
      const c = $("#check"); if (c) c.disabled = ui.s.text.trim() === "";
    }
  });

  document.addEventListener("keydown", (e) => {
    const S = ui.s;
    if (e.key === "Escape") {
      if (S && S.phase !== "end") { S.quitAsk = !S.quitAsk; renderSess(); }
      else if (ui.sheet) { ui.sheet = null; render(); }
      return;
    }
    if (!S || e.isComposing) return;
    const typing = e.target && e.target.tagName === "INPUT";
    if (e.key === "Enter") {
      if (S.quitAsk) return;
      if (S.phase === "q") { e.preventDefault(); checkAnswer(); }
      else if (S.phase === "fb") { e.preventDefault(); nextQuestion(); }
      return;
    }
    if (S.phase === "q" && !typing && !S.quitAsk) {
      const q = S.session.current.q;
      if (q.type === "mcq" && /^[1-9]$/.test(e.key) && +e.key <= q.choices.length) { S.sel = +e.key - 1; Sound.play("select"); renderSess(); }
      if (q.type === "tf" && (e.key === "v" || e.key === "f")) { S.sel = e.key === "v"; Sound.play("select"); renderSess(); }
    }
  });

  /* Sauvegarde de sécurité quand l'application passe en arrière-plan */
  const flush = () => { try { Store.save(); } catch (e) {} };
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });
  window.addEventListener("pagehide", flush);

  /* ───────────── Démarrage ───────────── */
  Store.load();
  Sound.configure(Store.state.settings.sound);
  render();
  /* Mode hors ligne : uniquement quand le site est servi en http(s) (pas dans Claude) */
  try {
    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !document.documentElement.hasAttribute("data-no-sw")) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  } catch (e) { /* facultatif */ }
  g.__lumo = { ui, render, Store, Content, Engine, Sound, Art };
})(window);

</script>
</body>
</html>
