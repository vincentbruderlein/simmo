<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7CCBFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SIMMO">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="claude:viewport-fit-sides" content="cover">
<title>SIMMO</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* SIMMO : parcours d'apprentissage immobilier.
 * Direction : jeu de vie et de construction. Ciel clair, panneaux vernis aux bords blancs,
 * boutons brillants, maisons isométriques, barres de « besoins », carrière.
 * Mise en page : une colonne mobile (max 560px), barre d'onglets bleue en bas,
 * série de questions en plein écran avec bulle de dialogue. */
:root {
  --bg: #DDF2FF;
  --sky1: #7CCBFF;
  --sky2: #D3F0FF;
  --surface: #FFFFFF;
  --surface-2: #E8F5FF;
  --ink: #16385A;
  --ink-2: #4A6B8C;
  --line: #BFDFF4;
  --edge: #8CC3E8;
  --rim: #FFFFFF;
  --blue: #2290DC;
  --blue-hi: #6DD0FF;
  --blue-deep: #1568AE;
  --on-blue: #FFFFFF;
  --green: #45B530;
  --green-hi: #8EE46A;
  --green-deep: #2A8A1C;
  --good-bg: #E3F8DA;
  --on-good: #FFFFFF;
  --sun: #FFC83D;
  --sun-deep: #D9A00F;
  --on-sun: #3B2A00;
  --bad: #E8504A;
  --bad-hi: #FF8F86;
  --bad-deep: #B3322D;
  --bad-bg: #FFE4E1;
  --on-bad: #FFFFFF;
  --nav-a: #5FC3FA;
  --nav-b: #2290DC;
  --cloud: rgba(255, 255, 255, .85);
  --shadow: 0 8px 22px rgba(22, 90, 150, .16);
  --font-display: "Fredoka", "Nunito", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --font-body: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  --nav-h: 74px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1E33; --sky1: #14406B; --sky2: #0B1E33; --surface: #15314E; --surface-2: #1D4268; --ink: #EAF5FF; --ink-2: #A1BFDB;
    --line: #2C5681; --edge: #3A6FA4; --rim: #2A5078; --blue: #2B88D2; --blue-hi: #5CB6F2; --blue-deep: #14588F;
    --green: #3DAA2C; --green-hi: #77D056; --green-deep: #237A18; --good-bg: #143A22;
    --bad: #E5524C; --bad-hi: #FF8C84; --bad-bg: #4A2024; --nav-a: #2B7DC0; --nav-b: #14588F; --cloud: rgba(180, 215, 255, .12);
    --shadow: 0 8px 22px rgba(0, 0, 0, .4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1E33; --sky1: #14406B; --sky2: #0B1E33; --surface: #15314E; --surface-2: #1D4268; --ink: #EAF5FF; --ink-2: #A1BFDB;
  --line: #2C5681; --edge: #3A6FA4; --rim: #2A5078; --blue: #2B88D2; --blue-hi: #5CB6F2; --blue-deep: #14588F;
  --green: #3DAA2C; --green-hi: #77D056; --green-deep: #237A18; --good-bg: #143A22;
  --bad: #E5524C; --bad-hi: #FF8C84; --bad-bg: #4A2024; --nav-a: #2B7DC0; --nav-b: #14588F; --cloud: rgba(180, 215, 255, .12);
  --shadow: 0 8px 22px rgba(0, 0, 0, .4); color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  position: relative; background: var(--bg); color: var(--ink);
  font: 600 16px/1.45 var(--font-body);
  -webkit-text-size-adjust: 100%; overscroll-behavior-y: none; min-height: 100%;
}
.sky {
  position: absolute; inset: 0 0 auto; height: 340px; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 60px 22px at 18% 96px, var(--cloud), transparent 70%),
    radial-gradient(ellipse 90px 30px at 82% 70px, var(--cloud), transparent 70%),
    radial-gradient(ellipse 70px 24px at 58% 170px, var(--cloud), transparent 70%),
    linear-gradient(var(--sky1), var(--sky2) 85%, var(--bg));
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.15; text-wrap: balance; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; border-radius: 10px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }

/* ───── Structure ───── */
.wrap {
  position: relative; z-index: 1; max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--sky1); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--sky1); }
.top .wrap { display: flex; align-items: center; gap: 8px; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 8px; margin-right: auto; }
.brand svg { width: 38px; height: 38px; flex: none; }
.wordmark {
  font: 700 28px/1 var(--font-display); letter-spacing: .04em; color: #fff;
  text-shadow: 0 2px 0 var(--blue-deep), 2px 0 0 var(--blue-deep), -2px 0 0 var(--blue-deep), 0 -2px 0 var(--blue-deep), 0 4px 0 rgba(10, 60, 110, .35);
}
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 6px 8px; border-radius: 999px; background: var(--surface);
  box-shadow: 0 0 0 2px var(--edge), 0 3px 0 var(--edge); font: 600 16px/1 var(--font-display);
}
.chip svg { width: 20px; height: 20px; }
.chip.fire svg { color: #FF7A1A; }
.chip.fire.cold svg { color: var(--ink-2); }
.chip.bricks svg { color: #D9663A; }
main#view { padding-block: 6px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; }

.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: linear-gradient(180deg, var(--nav-a), var(--nav-b));
  border-top: 3px solid #fff; box-shadow: 0 -4px 14px rgba(20, 80, 140, .25); padding-bottom: env(safe-area-inset-bottom, 0px);
}
:root[data-theme="dark"] .nav { border-top-color: var(--rim); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .nav { border-top-color: var(--rim); } }
.nav .wrap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding-block: 7px; }
.nav button {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; border-radius: 16px;
  color: #fff; font: 600 12.5px/1.1 var(--font-display); letter-spacing: .02em; text-shadow: 0 1px 0 rgba(10, 60, 110, .5);
}
.nav button svg { width: 27px; height: 27px; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 0 rgba(10, 60, 110, .45)); }
.nav button[aria-current="page"] {
  background: linear-gradient(180deg, #fff, #DDF1FF); color: var(--blue-deep); text-shadow: none;
  box-shadow: 0 3px 0 rgba(10, 60, 110, .35), inset 0 0 0 2px #fff;
}
.nav button[aria-current="page"] svg { filter: none; }

/* ───── Boutons vernis ───── */
.btn {
  position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 54px; padding: 12px 22px; width: 100%; border-radius: 18px;
  background: linear-gradient(180deg, var(--blue-hi) 0%, var(--blue) 52%, var(--blue-deep) 100%);
  border: 2px solid var(--blue-deep); color: var(--on-blue);
  font: 600 19px/1 var(--font-display); letter-spacing: .03em; text-shadow: 0 2px 0 rgba(8, 50, 100, .45);
  box-shadow: 0 5px 0 var(--blue-deep), 0 8px 12px rgba(20, 80, 140, .25); transition: transform .08s, box-shadow .08s;
}
.btn::after { content: ""; position: absolute; left: 6px; right: 6px; top: 3px; height: 42%; border-radius: 14px 14px 20px 20px; background: linear-gradient(rgba(255, 255, 255, .5), rgba(255, 255, 255, .06)); pointer-events: none; }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--blue-deep); }
.btn:disabled { background: linear-gradient(180deg, #E4EEF5, #C9D8E4); border-color: #AFC2D2; color: #7F97AB; text-shadow: none; box-shadow: 0 5px 0 #AFC2D2; cursor: not-allowed; }
:root[data-theme="dark"] .btn:disabled { background: linear-gradient(180deg, #264A6E, #1D3A59); border-color: #2C5681; color: #6F92B3; box-shadow: 0 5px 0 #2C5681; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn:disabled { background: linear-gradient(180deg, #264A6E, #1D3A59); border-color: #2C5681; color: #6F92B3; box-shadow: 0 5px 0 #2C5681; } }
.btn.good { background: linear-gradient(180deg, var(--green-hi), var(--green) 52%, var(--green-deep)); border-color: var(--green-deep); box-shadow: 0 5px 0 var(--green-deep), 0 8px 12px rgba(30, 120, 30, .25); }
.btn.good:active { box-shadow: 0 1px 0 var(--green-deep); }
.btn.bad { background: linear-gradient(180deg, var(--bad-hi), var(--bad) 52%, var(--bad-deep)); border-color: var(--bad-deep); box-shadow: 0 5px 0 var(--bad-deep), 0 8px 12px rgba(150, 40, 40, .25); }
.btn.bad:active { box-shadow: 0 1px 0 var(--bad-deep); }
.btn.ghost { background: var(--surface); border-color: var(--edge); color: var(--blue-deep); text-shadow: none; box-shadow: 0 5px 0 var(--edge); }
:root[data-theme="dark"] .btn.ghost { color: var(--blue-hi); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.ghost { color: var(--blue-hi); } }
.btn.ghost::after { display: none; }
.btn.ghost:active { box-shadow: 0 1px 0 var(--edge); }
.btn.sm { min-height: 44px; font-size: 16px; padding: 8px 16px; width: auto; border-radius: 14px; }

/* ───── Panneaux ───── */
.panel {
  background: var(--surface); border: 3px solid var(--rim); border-radius: 22px;
  box-shadow: 0 0 0 2px var(--edge), 0 6px 0 var(--edge), var(--shadow);
}
.panel.pad { padding: 16px; }
.panel h2 { font-size: 22px; margin-bottom: 10px; }
.stack { display: flex; flex-direction: column; gap: 14px; }

.demo {
  display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 18px; font-size: 14px; line-height: 1.35;
  background: #FFF2C2; color: #4A3600; border: 3px solid #fff; box-shadow: 0 0 0 2px #E8C44A, 0 4px 0 #E8C44A;
}
.demo b { font: 600 17px var(--font-display); display: block; }
.demo .tag { flex: none; background: var(--sun); color: var(--on-sun); font: 700 12px/1 var(--font-display); padding: 6px 8px; border-radius: 9px; letter-spacing: .06em; box-shadow: 0 2px 0 var(--sun-deep); }
.warn { background: var(--bad-bg); padding: 12px 14px; border-radius: 16px; font-size: 14px; box-shadow: 0 0 0 2px var(--bad); }
.note { font-size: 14px; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); }
.note.err { background: var(--bad-bg); box-shadow: 0 0 0 2px var(--bad); }
.note.ok { background: var(--good-bg); }

/* ───── Fiche du joueur et besoins ───── */
.me { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; }
.me .mascot { width: 64px; height: 76px; }
.rank { font: 600 20px/1.1 var(--font-display); }
.glossbar { position: relative; height: 16px; border-radius: 99px; background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--edge); overflow: hidden; }
.glossbar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(180deg, var(--blue-hi), var(--blue)); transition: width .6s; position: relative; }
.glossbar i::after { content: ""; position: absolute; left: 5px; right: 5px; top: 2px; height: 5px; border-radius: 5px; background: rgba(255, 255, 255, .55); }
.glossbar.green i { background: linear-gradient(180deg, var(--green-hi), var(--green)); }
.glossbar.sun i { background: linear-gradient(180deg, #FFE27A, var(--sun)); }
.needs { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 11px; }
.need { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; font-size: 14px; font-weight: 700; }
.need .ic { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--edge); font-size: 15px; }
.need .ic.done { background: var(--green); box-shadow: none; color: #fff; }
.need .ic svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 3.400; stroke-linecap: round; stroke-linejoin: round; }
.need .lab { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.review-cta { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; background: var(--bad-bg); border-radius: 18px; padding: 12px 14px; border: 3px solid var(--rim); box-shadow: 0 0 0 2px var(--bad), 0 4px 0 var(--bad); }
.review-cta b { font: 600 17px var(--font-display); display: block; }
.review-cta .go { margin-left: auto; font: 600 15px var(--font-display); color: var(--bad-deep); }
:root[data-theme="dark"] .review-cta .go { color: var(--bad-hi); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .review-cta .go { color: var(--bad-hi); } }

/* ───── Quartier : un terrain par matière ───── */
.lot { --w: #2F7DE1; padding: 14px 14px 10px; }
.lot-head { display: grid; grid-template-columns: minmax(120px, 42%) 1fr; gap: 10px; align-items: center; }
.lot-head .house { width: 100%; height: auto; display: block; overflow: visible; }
.lot h2 { font-size: 23px; margin-bottom: 4px; }
.lot .desc { font-size: 14px; color: var(--ink-2); line-height: 1.3; }
.stage-lab { display: inline-flex; align-items: center; gap: 6px; margin: 8px 0 6px; font: 600 14px var(--font-display); color: var(--ink); }
.stage-lab i { width: 10px; height: 10px; border-radius: 3px; background: var(--w); display: inline-block; }
.segs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.segs i { height: 12px; border-radius: 6px; background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--edge); }
.segs i.on { background: linear-gradient(180deg, color-mix(in srgb, var(--w) 55%, #fff), var(--w)); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--w) 70%, #000); }
.ind { animation: bob 1.8s ease-in-out infinite; transform-box: fill-box; }
@keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -4px; } }
.path { list-style: none; margin: 8px 0 0; padding: 8px 0 4px 8px; display: flex; flex-direction: column; gap: 4px; border-top: 2px dashed var(--line); }
.step { --w: #2F7DE1; display: flex; align-items: center; gap: 14px; position: relative; padding-block: 5px; }
.step + .step::before { content: ""; position: absolute; left: 34px; top: -12px; height: 16px; border-left: 4px dotted var(--line); }
.node {
  position: relative; flex: none; width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center; color: #fff;
  background: radial-gradient(circle at 35% 28%, color-mix(in srgb, var(--w) 45%, #fff), var(--w) 62%, color-mix(in srgb, var(--w) 80%, #000));
  border: 3px solid #fff; box-shadow: 0 0 0 2px color-mix(in srgb, var(--w) 75%, #000), 0 6px 0 color-mix(in srgb, var(--w) 65%, #000);
  transition: transform .08s, box-shadow .08s;
}
.node:active { transform: translateY(4px); box-shadow: 0 0 0 2px color-mix(in srgb, var(--w) 75%, #000), 0 2px 0 color-mix(in srgb, var(--w) 65%, #000); }
.node svg { width: 30px; height: 30px; fill: currentColor; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .25)); }
.node.locked { background: radial-gradient(circle at 35% 28%, #F4F8FB, #C9D6E1); color: #7E93A6; box-shadow: 0 0 0 2px #AFC0CF, 0 6px 0 #AFC0CF; }
:root[data-theme="dark"] .node.locked { background: radial-gradient(circle at 35% 28%, #34587C, #223F5E); color: #7F9CB9; box-shadow: 0 0 0 2px #2C5681, 0 6px 0 #2C5681; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .node.locked { background: radial-gradient(circle at 35% 28%, #34587C, #223F5E); color: #7F9CB9; box-shadow: 0 0 0 2px #2C5681, 0 6px 0 #2C5681; } }
.node.locked svg { filter: none; }
.node.done { background: radial-gradient(circle at 35% 28%, #FFF0A8, var(--sun) 60%, #E8A91A); color: var(--on-sun); box-shadow: 0 0 0 2px var(--sun-deep), 0 6px 0 var(--sun-deep); }
.node.done svg { filter: none; }
.node.open::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 4px solid var(--w); opacity: .4; animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(.9); opacity: .6; } 100% { transform: scale(1.18); opacity: 0; } }
.step-text { min-width: 0; }
.step-text b { display: block; font: 600 18px/1.15 var(--font-display); }
.step-text span.t { font-size: 13px; color: var(--ink-2); }
.stars { display: inline-flex; gap: 2px; vertical-align: middle; }
.stars svg { width: 18px; height: 18px; stroke-width: 1.500; stroke-linejoin: round; }
.stars .on { fill: var(--sun); stroke: var(--sun-deep); }
.stars .off { fill: var(--surface-2); stroke: var(--edge); }

/* ───── Fenêtre d'une étape ───── */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(10, 40, 80, .5); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
.sheet {
  width: 100%; max-width: 560px; background: var(--surface); border: 3px solid var(--rim); border-bottom: 0; border-radius: 28px 28px 0 0;
  box-shadow: 0 0 0 2px var(--edge); padding: 22px 20px calc(22px + env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px; animation: up .25s cubic-bezier(.2, .9, .3, 1.1);
}
.sheet h2 { font-size: 26px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { padding: 5px 11px; border-radius: 99px; background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--line); font: 700 13px/1.2 var(--font-body); }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }

/* ───── Mélange ───── */
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg button, .tog {
  padding: 10px 16px; border-radius: 16px; background: var(--surface); font: 600 16px/1 var(--font-display); min-height: 46px;
  display: inline-flex; align-items: center; gap: 8px; box-shadow: inset 0 0 0 2px var(--edge), 0 3px 0 var(--edge);
}
.seg button[aria-pressed="true"], .tog[aria-pressed="true"] { background: color-mix(in srgb, var(--blue) 16%, var(--surface)); box-shadow: inset 0 0 0 2px var(--blue), 0 3px 0 var(--blue-deep); color: var(--blue-deep); }
:root[data-theme="dark"] .seg button[aria-pressed="true"], :root[data-theme="dark"] .tog[aria-pressed="true"] { color: var(--blue-hi); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"], :root:not([data-theme="light"]) .tog[aria-pressed="true"] { color: var(--blue-hi); } }
.seg button:active, .tog:active { transform: translateY(2px); }
.wchip[aria-pressed="true"] { background: color-mix(in srgb, var(--w) 18%, var(--surface)); box-shadow: inset 0 0 0 2px var(--w), 0 3px 0 var(--w); color: var(--ink); }
:root[data-theme="dark"] .wchip[aria-pressed="true"] { color: var(--ink); }
.field-label { font: 600 16px var(--font-display); margin-bottom: 8px; display: block; }

/* ───── Carrière (progrès) ───── */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border-radius: 18px; padding: 12px 14px; border: 3px solid var(--rim); box-shadow: 0 0 0 2px var(--edge), 0 4px 0 var(--edge); }
.tile .v { font: 600 28px/1.1 var(--font-display); }
.tile .l { font-size: 13px; color: var(--ink-2); font-weight: 700; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink-2); font: 700 11px var(--font-body); }
.chart .val { fill: var(--ink); font-weight: 800; }
.chart .b { fill: var(--surface-2); stroke: var(--edge); stroke-width: 1.500; }
.chart .b.today { fill: var(--blue); stroke: var(--blue-deep); }
.chart .b.hit { fill: var(--green); stroke: var(--green-deep); }
.chart .goal { stroke: var(--sun-deep); stroke-width: 2; stroke-dasharray: 5 4; }
.chart .axis { stroke: var(--edge); stroke-width: 2; }
.mastery { display: grid; gap: 14px; }

.kicker { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font: 700 13px var(--font-body); color: var(--ink-2); }
.kicker .retry { background: var(--sun); color: var(--on-sun); padding: 4px 10px; border-radius: 99px; box-shadow: 0 2px 0 var(--sun-deep); }
.ask { display: grid; grid-template-columns: 62px 1fr; gap: 10px; align-items: end; }

.bubble::before { content: ""; position: absolute; left: -15px; bottom: 22px; width: 0; height: 0; border: 9px solid transparent; border-right: 11px solid var(--edge); }
.bubble::after { content: ""; position: absolute; left: -9px; bottom: 24px; width: 0; height: 0; border: 7px solid transparent; border-right: 9px solid var(--surface); }
.q-text { font: 600 23px/1.22 var(--font-display); }

.answer-input:focus { outline: none; box-shadow: 0 0 0 3px var(--blue), 0 5px 0 var(--blue-deep); }
.answer-input.right { background: var(--good-bg); box-shadow: 0 0 0 2px var(--green), 0 5px 0 var(--green-deep); }
.answer-input.wrong { background: var(--bad-bg); box-shadow: 0 0 0 2px var(--bad), 0 5px 0 var(--bad-deep); animation: shake .35s; }

.sess-foot { border-top: 3px solid #fff; background: var(--surface); box-shadow: 0 -4px 14px rgba(20, 80, 140, .18); padding: 14px max(18px, env(safe-area-inset-left, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-right, 0px)); }
:root[data-theme="dark"] .sess-foot { border-top-color: var(--rim); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sess-foot { border-top-color: var(--rim); } }
.sess-foot > div { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.sess-foot.good { background: var(--good-bg); border-top-color: var(--green); }
.sess-foot.bad { background: var(--bad-bg); border-top-color: var(--bad); }

.fb-head { display: flex; align-items: center; gap: 12px; }

.bad .fb-head b { color: var(--bad-deep); }
:root[data-theme="dark"] .good .fb-head b { color: var(--green-hi); }
:root[data-theme="dark"] .bad .fb-head b { color: var(--bad-hi); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .good .fb-head b { color: var(--green-hi); } :root:not([data-theme="light"]) .bad .fb-head b { color: var(--bad-hi); } }
.fb-expected { font-weight: 800; }
.fb-expl { font-size: 16px; line-height: 1.4; max-height: 32vh; overflow-y: auto; font-weight: 600; }
.fb-requeue { font-size: 14px; font-weight: 700; color: var(--ink-2); }
.quit { position: absolute; inset: 0; z-index: 5; background: rgba(10, 40, 80, .55); display: flex; align-items: center; justify-content: center; padding: 20px; }
.quit .panel { max-width: 380px; width: 100%; display: flex; flex-direction: column; gap: 12px; text-align: center; padding: 18px; }

/* ───── Fin de série ───── */
.end { position: relative; flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
.end-inner { max-width: 520px; width: 100%; margin: 0 auto; padding: 16px max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; flex: 1; justify-content: center; }
.end .mascot { width: 130px; height: 156px; animation: hop 1s ease-out; }
.end .house { width: min(300px, 80%); height: auto; overflow: visible; animation: hop .9s ease-out; }
@keyframes hop { 0% { transform: translateY(30px) scale(.85); opacity: 0; } 60% { transform: translateY(-10px); opacity: 1; } 100% { transform: none; } }
.house .s1, .house .s2, .house .s3 { transform-box: fill-box; }
.anim-1 .s1, .anim-2 .s2, .anim-3 .s3 { animation: drop .8s .35s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes drop { 0% { transform: translateY(-46px); opacity: 0; } 100% { transform: none; opacity: 1; } }
.end h1 { font-size: 34px; }
.stage-note { font: 600 18px var(--font-display); color: var(--ink); background: var(--surface); padding: 6px 14px; border-radius: 99px; box-shadow: 0 0 0 2px var(--edge), 0 3px 0 var(--edge); }
.big-stars { display: flex; gap: 8px; }
.big-stars svg { width: 54px; height: 54px; stroke-width: 1.500; stroke-linejoin: round; }
.big-stars svg.on { fill: var(--sun); stroke: var(--sun-deep); animation: pop .5s both; }
.big-stars svg.on:nth-child(2) { animation-delay: .15s; margin-top: -12px; }
.big-stars svg.on:nth-child(3) { animation-delay: .3s; }
.big-stars svg.off { fill: var(--surface-2); stroke: var(--edge); }
@keyframes pop { 0% { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
.res { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; }
.res .tile { text-align: center; padding: 10px 6px; }
.res .tile .v { font-size: 24px; }
.new-badges { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: 100%; }
.new-badges .pill { background: var(--sun); color: var(--on-sun); font-size: 14px; box-shadow: 0 2px 0 var(--sun-deep); }
.end-foot { padding: 14px max(18px, env(safe-area-inset-left, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; max-width: 520px; width: 100%; margin: 0 auto; }
.confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.confetti i { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
.mascot { display: block; overflow: visible; }
.mascot.cheer { animation: jump .6s ease-in-out 2; }
@keyframes jump { 50% { transform: translateY(-8px); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .confetti { display: none; }
}

  .sess-foot.fb, .sheet { animation: none; }
  .scrim { align-items: center; }

}

<script>
/* ── src/data/demo-pack.js ── */
/*
 * PACK DE DÉMONSTRATION — DONNÉES FICTIVES
 * Ces questions servent uniquement à tester le jeu. Elles seront remplacées
 * par vos propres cours. Le format ci-dessous est celui que devront produire
 * l'import de documents et la génération de questions (voir ARCHITECTURE.md).
 *
 * Un pack = { id, title, version, demo, worlds:[ { id, title, emoji, color, desc,
 *   levels:[ { id, title, desc, tier, questions:[…] } ] } ] }
 *
 * Question :
 *   type   'mcq' (choix multiple) | 'tf' (vrai/faux) | 'open' (réponse ouverte)
 *   notion libellé de la notion travaillée (sert au tableau de bord « à revoir »)
 *   diff   1 simple · 2 intermédiaire · 3 cas pratique
 *   q, context?, choices[]/answer (index) | answer (booléen) | accept[] (réponses acceptées)
 *   expl   explication affichée après une erreur
 *   source? { doc, page }   origine dans vos documents (pour plus tard)
 */
(function (g) {
  const mcq = (notion, diff, q, choices, answer, expl, context) =>
    ({ type: "mcq", notion, diff, q, choices, answer, expl, ...(context ? { context } : {}) });
  const tf = (notion, diff, q, answer, expl) =>
    ({ type: "tf", notion, diff, q, answer, expl });
  const open = (notion, diff, q, accept, expl, context) =>
    ({ type: "open", notion, diff, q, accept, expl, ...(context ? { context } : {}) });
  const level = (id, title, desc, tier, qs) => ({
    id, title, desc, tier,
    questions: qs.map((q, i) => ({ id: id + "-q" + (i + 1), ...q })),
  });

  const pack = {
    id: "demo",
    title: "Pack de démonstration",
    version: 1,
    demo: true,
    notice: "Questions fictives pour tester le jeu. Elles ne viennent pas de vos cours.",
    worlds: [
      /* ───────────── Monde 1 : Le vivant ───────────── */
      {
        id: "bio", title: "Le vivant", emoji: "🌱", color: "#12A27A",
        desc: "Cellule, ADN et énergie du vivant (démo).",
        levels: [
          level("bio-1", "La cellule", "Les bases : l’unité du vivant.", 1, [
            mcq("Cellule", 1, "Quelle est l’unité de base de tous les êtres vivants ?",
              ["L’atome", "La cellule", "L’organe", "Le tissu"], 1,
              "La cellule est la plus petite unité capable de vivre. Un organisme peut en compter une seule (une bactérie) ou des milliards (un humain)."),
            tf("Cellule", 1, "Les cellules végétales possèdent une paroi, contrairement aux cellules animales.", true,
              "Les cellules végétales sont entourées d’une paroi rigide faite de cellulose. Les cellules animales n’en ont pas."),
            mcq("Énergie cellulaire", 1, "Quel organite produit l’essentiel de l’énergie (ATP) de la cellule ?",
              ["Le noyau", "La vacuole", "La mitochondrie", "Le ribosome"], 2,
              "Les mitochondries transforment les nutriments en ATP, la « monnaie d’énergie » de la cellule."),
            tf("ADN", 1, "Chez les cellules eucaryotes, l’ADN se trouve principalement dans le noyau.", true,
              "Le noyau abrite l’ADN. Les cellules sans noyau (procaryotes, comme les bactéries) gardent leur ADN directement dans le cytoplasme."),
            mcq("Cellule", 1, "Qu’est-ce qu’un organisme unicellulaire ?",
              ["Un organisme sans ADN", "Un organisme fait d’une seule cellule", "Un organisme sans énergie", "Un organisme fait de deux tissus"], 1,
              "Unicellulaire = une seule cellule qui assure toutes les fonctions vitales (bactéries, levures, amibes…)."),
            open("Cellule", 1, "Comment s’appelle l’enveloppe qui entoure la cellule et contrôle ce qui entre et sort ?",
              ["membrane", "membrane plasmique", "membrane cellulaire"],
              "La membrane plasmique est une barrière sélective : elle laisse passer certaines molécules et en bloque d’autres."),
          ]),
          level("bio-2", "ADN et gènes", "La molécule qui porte l’information.", 2, [
            mcq("ADN", 2, "Combien de brins forment la molécule d’ADN ?",
              ["1", "2", "3", "4"], 1,
              "L’ADN est une double hélice : deux brins complémentaires enroulés l’un autour de l’autre."),
            mcq("ADN", 2, "Quelles sont les quatre bases de l’ADN ?",
              ["A, T, G, C", "A, U, G, C", "A, T, G, U", "T, U, G, C"], 0,
              "L’ADN contient adénine (A), thymine (T), guanine (G) et cytosine (C). L’uracile (U) n’existe que dans l’ARN."),
            tf("ADN", 2, "Dans l’ADN, l’adénine (A) s’apparie avec la guanine (G).", false,
              "L’appariement est toujours A avec T, et C avec G. C’est ce qui rend les deux brins complémentaires."),
            open("ARN", 2, "Quelle base remplace la thymine dans l’ARN ?",
              ["uracile", "l’uracile", "u"],
              "Dans l’ARN, la thymine est remplacée par l’uracile (U)."),
            open("Gènes", 2, "Comment appelle-t-on un segment d’ADN qui code une information génétique, souvent pour une protéine ?",
              ["gène", "un gène", "gènes"],
              "Un gène est une portion d’ADN contenant la « recette » d’une protéine (ou d’un ARN fonctionnel)."),
            mcq("Protéines", 2, "Quel est le rôle des ribosomes ?",
              ["Stocker l’ADN", "Fabriquer les protéines", "Digérer les déchets", "Produire l’énergie"], 1,
              "Les ribosomes lisent l’ARN messager et assemblent les acides aminés pour construire les protéines."),
          ]),
          level("bio-3", "Cas pratiques", "Appliquer ce qui a été vu.", 3, [
            mcq("Énergie cellulaire", 3, "Quelle est la conséquence la plus probable ?",
              ["La cellule produit moins d’ATP et manque d’énergie", "La cellule ne peut plus copier son ADN du tout", "La paroi de la cellule disparaît", "La cellule devient une cellule végétale"], 0,
              "Les mitochondries fabriquent l’ATP. Si elles ne fonctionnent plus, la cellule manque d’énergie pour ses activités.",
              "Un biologiste observe une cellule dont les mitochondries ne fonctionnent plus."),
            mcq("Photosynthèse", 3, "Quelle explication est la plus cohérente ?",
              ["La plante reçoit trop d’oxygène", "Sans lumière, la photosynthèse ralentit : moins de sucres produits et la chlorophylle se dégrade", "La plante manque de mitochondries", "Les racines produisent trop d’ADN"], 1,
              "La lumière alimente la photosynthèse. Sans elle, la plante produit moins de sucres et perd sa chlorophylle, d’où le jaunissement.",
              "Une plante est restée plusieurs semaines dans une pièce sans lumière. Ses feuilles jaunissent."),
            mcq("ADN", 3, "Quelle est la séquence du brin complémentaire ?",
              ["TACCG", "UACCG", "ATGGC", "CGTTA"], 0,
              "On apparie base à base : A→T, T→A, G→C, G→C, C→G. Résultat : TACCG. (U n’existe pas dans l’ADN.)",
              "Un brin d’ADN porte la séquence ATGGC."),
            tf("Gènes", 3, "Une mutation de l’ADN a toujours des conséquences graves.", false,
              "Beaucoup de mutations sont neutres ou « silencieuses » : elles ne changent pas la protéine produite ou n’ont aucun effet visible."),
            open("Photosynthèse", 3, "Quel gaz est libéré ?",
              ["oxygène", "dioxygène", "o2"],
              "La photosynthèse libère du dioxygène (O₂) en transformant CO₂ + eau + lumière en glucose.",
              "Équation simplifiée de la photosynthèse : CO₂ + eau + lumière → glucose + ?"),
            open("Cellule", 3, "Une bactérie et une cellule de foie : laquelle n’a pas de noyau ?",
              ["la bactérie", "bactérie", "une bactérie"],
              "La bactérie est une cellule procaryote : son ADN flotte dans le cytoplasme, sans noyau délimité."),
          ]),
        ],
      },

      /* ───────────── Monde 2 : Économie ───────────── */
      {
        id: "eco", title: "Économie du quotidien", emoji: "💶", color: "#E58A00",
        desc: "Prix, inflation et intérêts (démo).",
        levels: [

/* ── src/js/content.js ── */
/* Contenu : lit tous les packs enregistrés et construit des index.
 * Aujourd'hui les packs viennent de fichiers JS (data/*.js).
 * Plus tard, les packs importés depuis vos documents seront lus depuis
 * IndexedDB puis ajoutés ici avec Content.addPack(). */
(function (g) {
  const packs = (g.LUMO_PACKS = g.LUMO_PACKS || []);

  const Content = {
    worlds: [],
    levels: {},
    questions: {},
    notions: {},

    addPack(pack) {
      packs.push(pack);
      this.build();
    },

    build() {
      this.worlds = [];
      this.levels = {};
      this.questions = {};
      this.notions = {};
      for (const p of packs) {
        for (const w of p.worlds) {
          const world = { ...w, packId: p.id, demo: !!p.demo, levels: [], notionKeys: [] };
          w.levels.forEach((l, i) => {
            const lvl = { ...l, worldId: w.id, index: i, packId: p.id, demo: !!p.demo, questions: [] };
            l.questions.forEach((q) => {
              const nk = w.id + ":" + q.notion;
              const qq = { ...q, levelId: l.id, worldId: w.id, notionKey: nk };
              lvl.questions.push(qq);
              this.questions[q.id] = qq;
              if (!this.notions[nk]) {
                this.notions[nk] = { key: nk, label: q.notion, worldId: w.id, qids: [] };
                world.notionKeys.push(nk);
              }
              this.notions[nk].qids.push(q.id);
            });
            world.levels.push(lvl);
            this.levels[l.id] = lvl;
          });
          this.worlds.push(world);
        }
      }
    },

    world(id) { return this.worlds.find((w) => w.id === id); },
    allQuestions() { return Object.values(this.questions); },
    hasDemo() { return this.worlds.some((w) => w.demo); },
  };

  Content.build();
  g.Content = Content;
})(window);

/* ── src/js/storage.js ── */
/* Sauvegarde de la progression.
 *
 * Principes de fiabilité :
 *  - un seul objet JSON versionné (v), écrit après chaque réponse ;
 *  - avant chaque écriture, la version précédente valide est gardée en copie
 *    de secours (clé « .bak ») ;
 *  - après écriture, on relit pour vérifier ;
 *  - au chargement, si la donnée principale est illisible, on essaie la copie ;
 *  - export / import manuel (texte JSON) pour garder une sauvegarde ailleurs ;
 *  - si le navigateur refuse le stockage, l'appli fonctionne en mémoire et le
 *    signale clairement.
 */
(function (g) {
  const KEY = "simmo:v1";
  const BAK = "simmo:v1:bak";
  const OLD = "lumo:v1"; // ancien nom du prototype : repris automatiquement
  const VERSION = 1;

  const fresh = () => ({
    v: VERSION,
    created: Date.now(),
    saved: 0,
    xp: 0,
    streak: { count: 0, best: 0, last: null },
    days: {},       // 'YYYY-MM-DD' -> { xp, answers, ok, sessions, recovered }
    levels: {},     // levelId -> { done, stars, best, plays }
    q: {},          // questionId -> { n, ok, ko, last, lastOk }
    badges: {},     // badgeId -> timestamp
    stats: { sessions: 0, mix: 0, perfect: 0, answers: 0, ok: 0, openOk: 0, recovered: 0, goalDays: 0 },
    settings: { dailyGoal: 50, sound: { on: true, volume: 0.7 } },
  });

  function migrate(o) {
    const f = fresh();
    if (!o || typeof o !== "object") return f;
    const out = { ...f, ...o };
    out.streak = { ...f.streak, ...(o.streak || {}) };
    out.stats = { ...f.stats, ...(o.stats || {}) };
    out.settings = { ...f.settings, ...(o.settings || {}) };
    out.settings.sound = { ...f.settings.sound, ...((o.settings && o.settings.sound) || {}) };
    for (const k of ["days", "levels", "q", "badges"]) out[k] = o[k] && typeof o[k] === "object" ? o[k] : {};
    out.v = VERSION;
    return out;
  }

  function validShape(o) {
    return o && typeof o === "object" && typeof o.xp === "number" && o.levels && o.q;
  }

  const ls = (() => {
    try {
      const k = "simmo:test";
      localStorage.setItem(k, "1");
      localStorage.removeItem(k);
      return localStorage;
    } catch (e) {
      return null;
    }
  })();

  const dayKey = (d = new Date()) => {
    const p = (n) => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  };

  const Store = {
    state: null,
    status: { mode: ls ? "local" : "memory", ok: true, error: "", lastSave: 0, recovered: false, persistent: null },
    dayKey,

    load() {
      let loaded = null, fromOther = false;
      if (ls) {
        for (const k of [KEY, BAK, OLD]) {
          try {
            const raw = ls.getItem(k);
            if (!raw) continue;
            const o = JSON.parse(raw);
            if (validShape(o)) {
              loaded = migrate(o);
              if (k === BAK) this.status.recovered = true;
              if (k !== KEY) fromOther = true;
              break;
            }
          } catch (e) { /* on essaie la copie suivante */ }
        }
      }
      this.state = loaded || fresh();
      this.status.lastSave = this.state.saved || 0;
      if (loaded && fromOther) this.save();
      this.askPersistence();
      return this.state;
    },

    save() {
      const s = this.state;
      s.saved = Date.now();
      if (!ls) { this.status = { ...this.status, ok: false, error: "Stockage indisponible : la progression sera perdue à la fermeture." }; return false; }
      try {
        const json = JSON.stringify(s);
        const prev = ls.getItem(KEY);
        if (prev) { try { if (validShape(JSON.parse(prev))) ls.setItem(BAK, prev); } catch (e) {} }
        ls.setItem(KEY, json);
        if (ls.getItem(KEY) !== json) throw new Error("Relecture différente de l’écriture");
        this.status.ok = true;
        this.status.error = "";
        this.status.lastSave = s.saved;
        return true;
      } catch (e) {
        this.status.ok = false;
        this.status.error = "Sauvegarde impossible (" + (e && e.name ? e.name : "erreur") + "). Exportez votre progression depuis Réglages.";
        return false;
      }
    },

    async askPersistence() {
      try {
        if (navigator.storage && navigator.storage.persist) {
          this.status.persistent = (await navigator.storage.persisted()) || (await navigator.storage.persist());
        }
      } catch (e) { /* facultatif */ }
    },

    /* Jour courant */
    today() {
      const k = dayKey();
      const d = this.state.days;
      if (!d[k]) d[k] = { xp: 0, answers: 0, ok: 0, sessions: 0, recovered: 0 };
      return d[k];
    },

    qStat(id) {
      return this.state.q[id] || { n: 0, ok: 0, ko: 0, last: 0, lastOk: null };
    },

    recordAnswer(q, ok) {
      const s = this.state;
      const r = s.q[q.id] || (s.q[q.id] = { n: 0, ok: 0, ko: 0, last: 0, lastOk: null });
      r.n++; ok ? r.ok++ : r.ko++;
      r.last = Date.now();
      r.lastOk = ok;
      s.stats.answers++;

        noise(c, o, { t: t + dt, d: 0.05, f: 2400, q: 1.2, vol: 0.3 });
        tone(c, o, { t: t + dt, f: 170 - i * 12, to: 70, d: 0.09, type: "triangle", vol: 0.32 });
      });
    } },
    fanfare: { d: 1.5, fn: (c, o, t) => {
      [N.C5, N.E5, N.G5, N.C6].forEach((f, i) => tone(c, o, { t: t + i * 0.11, f, d: 0.22, type: "triangle", vol: 0.2 }));
      [N.C5, N.E5, N.G5, N.C6].forEach((f) => tone(c, o, { t: t + 0.55, f, d: 0.75, type: "triangle", vol: 0.11 }));
      tone(c, o, { t: t + 0.55, f: N.C7, d: 0.6, type: "sine", vol: 0.05 });
    } },
    badge: { d: 0.9, fn: (c, o, t) => {
      [N.E6, N.G6, N.C7, N.G6, N.C7].forEach((f, i) => tone(c, o, { t: t + i * 0.07, f, d: 0.22, type: "sine", vol: 0.12 }));
    } },
    quit: { d: 0.2, fn: (c, o, t) => { tone(c, o, { t, f: 330, to: 220, d: 0.16, type: "sine", vol: 0.16 }); } },
  };

  const Sound = {
    on: true,
    volume: 0.7,
    ctx: null,
    master: null,
    RECIPES,

    /* Réglages relus depuis la sauvegarde */
    configure(s) {
      if (!s) return;
      this.on = s.on !== false;
      this.volume = typeof s.volume === "number" ? s.volume : 0.7;
      if (this.master) this.master.gain.value = this.volume * 1.4;
    },

    /* À appeler dans un geste de l'utilisateur (toucher / clic). */
    unlock() {
      try {
        if (!this.ctx) {
          const AC = g.AudioContext || g.webkitAudioContext;
          if (!AC) return false;
          try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
          this.ctx = new AC();
          const comp = this.ctx.createDynamicsCompressor();
          this.master = this.ctx.createGain();
          this.master.gain.value = this.volume * 1.4;
          this.master.connect(comp); comp.connect(this.ctx.destination);
        }
        if (this.ctx.state !== "running") this.ctx.resume();
        return true;
      } catch (e) { return false; }
    },

    play(name, delay = 0) {
      if (!this.on || !RECIPES[name]) return;
      if (!this.unlock()) return;
      try { RECIPES[name].fn(this.ctx, this.master, this.ctx.currentTime + 0.01 + delay); } catch (e) { /* le son est facultatif */ }
    },

    /* Rendu hors ligne (tests) : renvoie les échantillons d'un son. */
    async render(name) {
      const r = RECIPES[name], sr = 44100;
      const OC = g.OfflineAudioContext || g.webkitOfflineAudioContext;
      const ctx = new OC(1, Math.ceil(sr * (r.d + 0.1)), sr);
      const out = ctx.createGain(); out.gain.value = 0.98; out.connect(ctx.destination);
      r.fn(ctx, out, 0);
      const buf = await ctx.startRendering();
      return buf.getChannelData(0);
    },
  };

  g.Sound = Sound;
})(window);

/* Moteur : correction des réponses, déroulé d'une session, récompenses.
 * Aucun accès au DOM ici : tout est testable en isolation. */
(function (g) {
  const { Store, Content } = g;

  /* ───────────── Correction ───────────── */
  function norm(s) {
    return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
      .replace(/[’']/g, " ").replace(/[^a-z0-9]+/g, " ").trim()
      .replace(/^(le|la|les|l|un|une|des|du|de|d) /, "");
  }
  function lev(a, b) {
    if (a === b) return 0;
    const m = a.length, n = b.length;
    if (!m) return n; if (!n) return m;
    let prev = Array.from({ length: n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++) {
      const cur = [i];
      for (let j = 1; j <= n; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      prev = cur;
    }
    return prev[n];
  }

  const Grade = {
    norm, lev,
    /* Réponse ouverte : exacte, presque exacte (faute de frappe) ou contenant la bonne réponse. */
    open(q, text) {
      if (text === null || text === undefined) return { ok: false };
      const u = norm(text);
      if (!u) return { ok: false };
      for (const raw of q.accept) {
        const a = norm(raw);
        if (!a) continue;
        if (u === a) return { ok: true };
        const numeric = /^[0-9 ]+$/.test(a);
        if (numeric) continue;
        const tol = a.length >= 9 ? 2 : a.length >= 5 ? 1 : 0;
        if (tol && lev(u, a) <= tol) return { ok: true, typo: true };
        if (a.length >= 4 && (" " + u + " ").includes(" " + a + " ")) return { ok: true };
      }
      return { ok: false };
    },
    check(q, given) {
      if (q.type === "mcq") return { ok: given === q.answer };
      if (q.type === "tf") return { ok: given === q.answer };
      return this.open(q, given);
    },
    expected(q) {
      if (q.type === "mcq") return q.choices[q.answer];
      if (q.type === "tf") return q.answer ? "Vrai" : "Faux";
      return q.accept[0];
    },
  };

  /* ───────────── Utilitaires ───────────── */
  function shuffle(a) {
    const r = a.slice();
    for (let i = r.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [r[i], r[j]] = [r[j], r[i]];
    }
    return r;
  }

  const TIERS = { 1: "Facile", 2: "Intermédiaire", 3: "Cas pratiques" };
  /* Échelons de carrière, un par niveau de joueur */
  const CAREER = ["Stagiaire", "Assistant·e de gérance", "Gestionnaire", "Gérant·e d’immeubles", "Responsable de portefeuille", "Directeur·rice d’agence"];

  /* ───────────── Progression ───────────── */
  const Progress = {
    levelState(level) {
      const L = Store.state.levels;
      const rec = L[level.id];
      if (rec && rec.done) return "done";
      if (level.index === 0) return "open";
      const prev = Content.world(level.worldId).levels[level.index - 1];
      return L[prev.id] && L[prev.id].done ? "open" : "locked";
    },
    /* Prochain niveau jouable d'un monde */
    currentLevel(world) {
      return world.levels.find((l) => this.levelState(l) === "open") || null;
    },
    worldProgress(world) {
      const done = world.levels.filter((l) => this.levelState(l) === "done").length;
      return { done, total: world.levels.length };
    },
    /* Questions des niveaux déjà accessibles (jouables ou terminés) */
    unlockedQuestions(worldIds) {
      const out = [];
      for (const w of Content.worlds) {
        if (worldIds && !worldIds.includes(w.id)) continue;
        for (const l of w.levels) if (this.levelState(l) !== "locked") out.push(...l.questions);
      }
      return out;
    },
    /* Une question à retravailler : dernière réponse fausse */
    isWeakQuestion(id) {
      const r = Store.state.q[id];
      return !!r && r.lastOk === false;
    },
    notionStats(key) {
      const n = Content.notions[key];
      let seen = 0, ok = 0, ko = 0, mastered = 0, weak = 0;
      for (const id of n.qids) {
        const r = Store.state.q[id];
        if (!r) continue;
        seen++; ok += r.ok; ko += r.ko;
        if (r.lastOk) mastered++; else weak++;
      }
      const tot = ok + ko;
      return { key, label: n.label, worldId: n.worldId, total: n.qids.length, seen, mastered, weak, acc: tot ? ok / tot : null };
    },
    /* Notions à revoir : une erreur récente, ou une précision faible */
    notionsToReview() {
      return Object.keys(Content.notions)
        .map((k) => this.notionStats(k))
        .filter((s) => s.seen > 0 && (s.weak > 0 || (s.acc !== null && s.acc < 0.7)))
        .sort((a, b) => b.weak - a.weak || a.acc - b.acc);
    },
    worldMastery(world) {
      const qs = world.levels.flatMap((l) => l.questions);
      const mastered = qs.filter((q) => (Store.state.q[q.id] || {}).lastOk === true).length;
      return { mastered, total: qs.length };
    },
    accuracy() {
      const s = Store.state.stats;
      return s.answers ? s.ok / s.answers : null;
    },
    playerLevel() {
      const xp = Store.state.xp, per = 120, level = Math.floor(xp / per) + 1;
      const last = CAREER.length;
      const title = level <= last ? CAREER[level - 1] : CAREER[last - 1] + " · rang " + (level - last + 1);
      return { level, into: xp % per, per, title };
    },
    /* Étape de construction de la maison d'un monde : 0 terrain, 1 fondations, 2 gros œuvre, 3 terminée */
    houseStage(world) {
      const { done, total } = this.worldProgress(world);
      if (!done) return 0;
      if (done === total) return 3;
      return Math.min(2, Math.ceil((done * 2) / total));
    },
    streakAlive() {
      const st = Store.state.streak;
      if (!st.last) return 0;
      const today = Store.dayKey(), y = Store.dayKey(new Date(Date.now() - 864e5));
      return st.last === today || st.last === y ? st.count : 0;
    },
    last7() {
      const out = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date(Date.now() - i * 864e5);
        const k = Store.dayKey(d);
        const r = Store.state.days[k];
        out.push({ key: k, date: d, xp: r ? r.xp : 0, today: i === 0 });
      }
      return out;
    },
  };

  /* ───────────── Sélection de questions ───────────── */
  const Pick = {
    level(level) {
      return level.questions.slice();
    },
    /* Mélange de plusieurs mondes : alternance entre mondes, option « points faibles » d'abord. */
    mix({ worldIds, n, weakFirst }) {
      const pool = Progress.unlockedQuestions(worldIds);
      const byWorld = {};
      for (const q of pool) (byWorld[q.worldId] = byWorld[q.worldId] || []).push(q);
      const score = (q) => {
        const r = Store.state.q[q.id];
        if (!weakFirst) return Math.random();
        if (!r) return 0.5 + Math.random() * 0.1;
        return (r.lastOk === false ? 2 : 0) + r.ko / Math.max(1, r.n) + Math.random() * 0.1;
      };
      const groups = Object.values(byWorld).map((arr) => arr.map((q) => [score(q), q]).sort((a, b) => b[0] - a[0]).map((x) => x[1]));
      const out = [];
      let i = 0;
      while (out.length < n && groups.some((g2) => g2.length)) {
        const grp = groups[i % groups.length];
        if (grp.length) out.push(grp.shift());
        i++;
      }
      return shuffle(out);
    },
    notion(key) {
      const n = Content.notions[key];
      const qs = n.qids.map((id) => Content.questions[id]);
      if (qs.length >= 5) return shuffle(qs);
      const extra = Progress.unlockedQuestions([n.worldId]).filter((q) => !n.qids.includes(q.id));
      return shuffle(qs).concat(shuffle(extra).slice(0, 5 - qs.length));
    },
    weak(max = 12) {
      return shuffle(Content.allQuestions().filter((q) => Progress.isWeakQuestion(q.id))).slice(0, max);
    },
  };

  /* ───────────── Récompenses ───────────── */
  const BADGES = [
    { id: "first", icon: "🧱", name: "Première pierre", hint: "Terminer une étape", test: (s) => Object.values(s.levels).some((l) => l.done) },
    { id: "stars3", icon: "⭐", name: "Standing 3 étoiles", hint: "Obtenir 3 étoiles sur une étape", test: (s) => Object.values(s.levels).some((l) => l.stars >= 3) },
    { id: "perfect", icon: "💎", name: "Sans faute", hint: "Finir une série sans aucune erreur", test: (s) => s.stats.perfect >= 1 },
    { id: "streak3", icon: "🔥", name: "Voisin fidèle", hint: "3 jours de suite", test: (s) => s.streak.best >= 3 },
    { id: "streak7", icon: "🌋", name: "Habitué du quartier", hint: "7 jours de suite", test: (s) => s.streak.best >= 7 },
    { id: "xp100", icon: "⚡", name: "Cent briques", hint: "Gagner 100 briques", test: (s) => s.xp >= 100 },
    { id: "xp500", icon: "🚀", name: "Cinq cents briques", hint: "Gagner 500 briques", test: (s) => s.xp >= 500 },
    { id: "world", icon: "🏠", name: "Clés en main", hint: "Terminer toutes les étapes d’une maison", test: () => Content.worlds.some((w) => w.levels.every((l) => (Store.state.levels[l.id] || {}).done)) },
    { id: "mixer", icon: "🔀", name: "Tour du quartier", hint: "Terminer une série mélangée", test: (s) => s.stats.mix >= 1 },
    { id: "rescue", icon: "🎯", name: "Réparateur", hint: "Réussir 5 questions déjà ratées", test: (s) => s.stats.recovered >= 5 },
    { id: "writer", icon: "✍️", name: "Plume", hint: "10 réponses ouvertes justes", test: (s) => s.stats.openOk >= 10 },
    { id: "goal", icon: "🎉", name: "Journée remplie", hint: "Atteindre l’objectif du jour", test: (s) => s.stats.goalDays >= 1 },
  ];

  const Rewards = {
    BADGES,
    objectives() {
      const d = Store.today(), goal = Store.state.settings.dailyGoal;
      return [
        { id: "xp", label: `Gagner ${goal} briques`, value: Math.min(d.xp, goal), max: goal },
        { id: "sess", label: "Terminer une série", value: Math.min(d.sessions, 1), max: 1 },
        { id: "ans", label: "Répondre à 15 questions", value: Math.min(d.answers, 15), max: 15 },
        { id: "rec", label: "Corriger 3 questions ratées", value: Math.min(d.recovered, 3), max: 3 },
      ];
    },
    checkBadges() {
      const s = Store.state, fresh = [];
      for (const b of BADGES) if (!s.badges[b.id] && b.test(s)) { s.badges[b.id] = Date.now(); fresh.push(b); }
      return fresh;
    },
  };

  /* ───────────── Session de jeu ───────────── */
  function mkItem(q, retry) {
    const item = { q, retry };
    if (q.type === "mcq") item.order = shuffle(q.choices.map((_, i) => i));
    return item;
  }

  class Session {
    constructor(o) {
      this.mode = o.mode;            // 'level' | 'mix' | 'review'
      this.title = o.title;
      this.subtitle = o.subtitle || "";
      this.level = o.level || null;
      this.again = o.again || null;  // pour « Rejouer »
      this.total = o.questions.length;
      this.queue = o.questions.map((q) => mkItem(q, false));
      this.solved = 0;
      this.firstOk = 0;
      this.answers = 0;
      this.requeued = 0;
      this.recovered = 0;
      this.xpRaw = 0;
      this.missed = new Set();
      this.pending = null;
      this.finished = false;
    }
    get current() { return this.queue[0]; }

    /* Corrige la réponse, l'enregistre, mais n'avance pas : l'écran de feedback utilise encore la question. */
    submit(given) {
      const item = this.queue[0];
      const wasWeak = Progress.isWeakQuestion(item.q.id);
      const res = Grade.check(item.q, given);
      this.answers++;
      if (res.ok) {
        this.solved++;
        if (!item.retry) {
          this.firstOk++; this.xpRaw += 10;
          if (wasWeak) { this.recovered++; Store.state.stats.recovered++; Store.today().recovered++; }
        } else this.xpRaw += 4;
      } else {
        this.missed.add(item.q.id);
      }
      Store.recordAnswer(item.q, res.ok);
      this.pending = { item, res, given };
      return res;
    }

    /* Passe à la suite. Une question ratée repart à la fin de la file. */
    advance() {
      const { item, res } = this.pending;
      this.queue.shift();
      if (!res.ok) { this.queue.push(mkItem(item.q, true)); this.requeued++; }
      this.pending = null;
      return this.queue.length === 0;
    }

    finish() {
      if (this.finished) return this.summary;
      this.finished = true;
      const s = Store.state;
      const acc = this.total ? this.firstOk / this.total : 0;
      let xp = this.xpRaw, stars = 0;
      if (this.mode === "level") {
        stars = acc >= 0.99 ? 3 : acc >= 0.7 ? 2 : 1;
        xp += 15 + (stars === 3 ? 10 : 0);
      } else xp += 8;

      const perfect = this.missed.size === 0;
      const goal = s.settings.dailyGoal;
      const day = Store.today();
      const before = day.xp;

      s.xp += xp; day.xp += xp; day.sessions++;
      s.stats.sessions++;
      if (this.mode === "mix") s.stats.mix++;
      if (perfect) s.stats.perfect++;

      if (this.mode === "level") {
        const rec = s.levels[this.level.id] || { done: false, stars: 0, best: 0, plays: 0 };
        rec.done = true; rec.plays++;
        rec.stars = Math.max(rec.stars, stars);
        rec.best = Math.max(rec.best, Math.round(acc * 100));
        s.levels[this.level.id] = rec;
      }

      /* Série de jours */
      const today = Store.dayKey(), st = s.streak;
      if (st.last !== today) {
        const y = Store.dayKey(new Date(Date.now() - 864e5));
        st.count = st.last === y ? st.count + 1 : 1;
        st.last = today;
        st.best = Math.max(st.best, st.count);
      }

      const goalJustReached = before < goal && day.xp >= goal;
      if (goalJustReached) s.stats.goalDays++;

      const newBadges = Rewards.checkBadges();
      Store.save();

      let nextLevel = null;
      if (this.mode === "level") {
        const w = Content.world(this.level.worldId);
        const nx = w.levels[this.level.index + 1];
        if (nx && Progress.levelState(nx) === "open") nextLevel = nx;
      }
      this.summary = { xp, stars, acc, perfect, requeued: this.requeued, recovered: this.recovered, newBadges, goalJustReached, streak: st.count, nextLevel };
      return this.summary;
    }
  }

  g.Engine = { Grade, Progress, Pick, Rewards, Session, TIERS, CAREER, shuffle };
})(window);
